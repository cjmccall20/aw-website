name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - claude/aggie-wranglers-redesign-plan-2oQoo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install webapp dependencies
        run: npm install
        working-directory: webapp

      - name: Build static site
        run: npm run build
        working-directory: webapp
        env:
          NODE_ENV: production

      - name: Stage Pages site
        # The Next.js static export goes to webapp/out. We also keep the legacy
        # OVERVIEW.html accessible at /overview.html for direct link-sharing.
        run: |
          mkdir -p _site
          cp -R webapp/out/. _site/
          cp OVERVIEW.html _site/overview.html
          # Tell GitHub Pages not to run Jekyll on Next.js underscore-prefixed assets.
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
